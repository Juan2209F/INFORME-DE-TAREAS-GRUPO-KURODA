plugins {
    id 'com.android.application'
}

/* Versión: la pone el workflow de GitHub (.github/workflows/android-apk.yml) con
   APK_VERSION_NAME. El versionCode se calcula de la versión: 1.2.3 -> 10203, así cada
   versión nueva siempre es mayor que la anterior y Android acepta la actualización. */
def nombreVersion = System.getenv('APK_VERSION_NAME') ?: '1.1.0'
def partesVersion = (nombreVersion.tokenize('.') + ['0', '0', '0']).take(3).collect { it.replaceAll('[^0-9]', '') ?: '0' }
def codigoVersion = partesVersion[0].toInteger() * 10000 + partesVersion[1].toInteger() * 100 + partesVersion[2].toInteger()

/* Firma: el workflow decodifica el secreto ANDROID_KEYSTORE_BASE64 y pasa la ruta aquí.
   Todas las versiones deben firmarse con la MISMA llave o Android rechaza la actualización. */
def llave = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.grupokuroda.auditoria'
    compileSdk 34

    defaultConfig {
        applicationId 'com.grupokuroda.auditoria'
        minSdk 26
        targetSdk 34
        versionCode codigoVersion
        versionName nombreVersion

        buildConfigField 'String', 'URL_APP', '"https://informe-de-tareas-grupo-kuroda.vercel.app/"'
        /* latest.json que publica el workflow en Supabase Storage (bucket público app-releases). */
        buildConfigField 'String', 'URL_ACTUALIZACION', '"https://xlygkolfmetytowixtnb.supabase.co/storage/v1/object/public/app-releases/latest.json"'
    }

    signingConfigs {
        if (llave) {
            release {
                storeFile file(llave)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (llave) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

# Los métodos que la página llama por window.GKAndroid no se deben renombrar ni quitar.
-keepclassmembers class * {
    @android.webkit.JavascriptInterface <methods>;
}
-keepattributes JavascriptInterface

<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <!-- Solo Android 8 y 9 piden permiso para guardar en Descargas. -->
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
    <!-- Para instalar las actualizaciones descargadas desde Supabase. -->
    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

    <application
        android:allowBackup="false"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="false">

        <activity
            android:name=".MainActivity"
            android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
            android:exported="true"
            android:launchMode="singleTask"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

        <!-- Entrega al instalador de Android el APK descargado y a otras apps los archivos
             guardados (Abrir / Compartir), sin exponer el resto de los archivos de la app. -->
        <provider
            android:name=".ArchivoProvider"
            android:authorities="com.grupokuroda.auditoria.archivos"
            android:exported="false"
            android:grantUriPermissions="true" />
    </application>
</manifest>

/* Puente de descargas — Grupo Kuroda (lo inyecta la app Android).
   El WebView no sabe guardar los archivos que la página genera en memoria (PNG, CSV, Excel,
   PDF, PPTX: enlaces <a download> con blob: o data:). Aquí se interceptan y se pasan a
   Android (GKAndroid) en trozos para guardarlos en Descargas.
   Se instala también en los iframes del mismo origen (Generador, Documentos, Activos). */
(function () {
  'use strict';
  var TROZO = 3 * 256 * 1024; /* múltiplo de 3: los trozos en base64 se pueden concatenar */

  function enviar(blob, nombre) {
    var id = Date.now() + Math.random().toString(36).slice(2);
    var pos = 0;
    GKAndroid.inicio(id, nombre, blob.type || '');
    (function siguiente() {
      if (pos >= blob.size) { GKAndroid.fin(id); return; }
      var r = new FileReader();
      r.onload = function () {
        var s = r.result;
        GKAndroid.trozo(id, s.slice(s.indexOf(',') + 1));
        pos += TROZO;
        siguiente();
      };
      r.onerror = function () { GKAndroid.error(id); };
      r.readAsDataURL(blob.slice(pos, pos + TROZO));
    })();
  }

  function instalar(win) {
    try {
      if (!win || win.__gkPuente) return;
      win.__gkPuente = true;
    } catch (e) { return; } /* iframe de otro origen */

    var doc = win.document, URL_ = win.URL, Ancla = win.HTMLAnchorElement.prototype;
    var blobs = {};

    /* Se guarda el Blob de cada URL: la página suele revocarla justo después del clic. */
    var crear = URL_.createObjectURL;
    URL_.createObjectURL = function (o) {
      var u = crear.apply(URL_, arguments);
      if (o && typeof o.size === 'number' && typeof o.slice === 'function') {
        blobs[u] = o;
        win.setTimeout(function () { delete blobs[u]; }, 120000);
      }
      return u;
    };

    function interceptar(a) {
      if (!a || !a.hasAttribute || !a.hasAttribute('download')) return false;
      var h = a.href || '';
      if (h.indexOf('blob:') !== 0 && h.indexOf('data:') !== 0) return false;
      var nombre = a.getAttribute('download') || 'descarga';
      if (blobs[h]) enviar(blobs[h], nombre);
      else win.fetch(h).then(function (r) { return r.blob(); })
        .then(function (b) { enviar(b, nombre); })
        .catch(function () { GKAndroid.error(''); });
      return true;
    }

    var clic = Ancla.click;
    Ancla.click = function () {
      if (interceptar(this)) return;
      return clic.apply(this, arguments);
    };
    /* jsPDF / FileSaver disparan el clic con dispatchEvent sobre un <a> fuera del documento. */
    var despachar = Ancla.dispatchEvent;
    Ancla.dispatchEvent = function (e) {
      if (e && e.type === 'click' && interceptar(this)) return true;
      return despachar.apply(this, arguments);
    };
    doc.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a[download]');
      if (a && interceptar(a)) e.preventDefault();
    }, true);

    /* Iframes: los que ya existen y los que se agreguen o recarguen después. */
    function revisar(f) {
      try { instalar(f.contentWindow); } catch (e) {}
      if (!f.__gkCarga) {
        f.__gkCarga = true;
        f.addEventListener('load', function () { try { instalar(f.contentWindow); } catch (e) {} });
      }
    }
    function revisarTodos() { Array.prototype.forEach.call(doc.querySelectorAll('iframe'), revisar); }
    revisarTodos();
    if (doc.documentElement) {
      new win.MutationObserver(revisarTodos).observe(doc.documentElement, { childList: true, subtree: true });
    }
  }

  instalar(window);
})();

package com.grupokuroda.auditoria;

import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.net.Uri;
import android.os.SystemClock;
import android.provider.Settings;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.ByteArrayOutputStream;
import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.IOException;
import java.io.InputStream;
import java.io.InterruptedIOException;
import java.io.OutputStream;
import java.net.HttpURLConnection;
import java.net.URL;
import java.nio.charset.StandardCharsets;
import java.security.MessageDigest;
import java.util.Locale;

/* Actualizaciones desde Supabase Storage.
   El workflow .github/workflows/android-apk.yml sube cada versión al bucket público
   "app-releases" junto con latest.json:
     { "versionCode": 10100, "versionName": "1.1.0", "url": ".../AuditoriaKuroda-v1.1.0.apk",
       "sha256": "…", "tamano": 123456, "notas": ["…"], "obligatoria": false, "versionMinima": 0 }
   Al abrir la app se lee latest.json; si trae un versionCode mayor que el instalado se ofrece
   la actualización, se descarga aquí mismo (con avance), se verifica su SHA-256 y se abre el
   instalador de Android. "obligatoria" (o versionMinima mayor a la instalada) no deja posponerla. */
final class Actualizador {

    private final MainActivity act;
    private JSONObject info;
    private Hoja hoja;
    private File apk;
    private boolean revisando, descargando, esperandoPermiso;
    private volatile boolean cancelado;

    Actualizador(MainActivity a) {
        act = a;
        limpiar();
    }

    /* manual = el usuario tocó "Buscar actualizaciones": se le avisa también si ya está al día. */
    void revisar(final boolean manual) {
        if (revisando || descargando || (hoja != null && hoja.visible())) return;
        revisando = true;
        final Hoja espera = manual ? act.hoja().logo().etiqueta("Actualizaciones").titulo("Buscando versión nueva…") : null;
        if (espera != null) { espera.progreso(-1, null); espera.mostrar(); }
        new Thread(() -> {
            JSONObject j = null;
            try { j = leerInfo(); } catch (Exception ignorado) { }
            final JSONObject datos = j;
            act.runOnUiThread(() -> {
                revisando = false;
                if (espera != null) espera.cerrar();
                if (datos != null && datos.optInt("versionCode", 0) > BuildConfig.VERSION_CODE && !datos.optString("url").isEmpty()) {
                    info = datos;
                    ofrecer();
                } else if (manual) {
                    Hoja h = act.hoja().logo().etiqueta("Actualizaciones");
                    if (datos != null) h.titulo("Ya tienes la versión más reciente").mensaje("Versión instalada: " + BuildConfig.VERSION_NAME);
                    else h.titulo("No se pudo revisar").mensaje("Revisa tu conexión a internet e inténtalo de nuevo.");
                    h.primario("Listo", null, true).cancelable(true, null).mostrar();
                }
            });
        }, "gk-revisar").start();
    }

    private static JSONObject leerInfo() throws IOException, org.json.JSONException {
        HttpURLConnection c = (HttpURLConnection) new URL(BuildConfig.URL_ACTUALIZACION + "?t=" + System.currentTimeMillis()).openConnection();
        c.setConnectTimeout(10000);
        c.setReadTimeout(15000);
        c.setUseCaches(false);
        c.setRequestProperty("Cache-Control", "no-cache");
        try {
            if (c.getResponseCode() != 200) throw new IOException("HTTP " + c.getResponseCode());
            try (InputStream in = c.getInputStream()) {
                ByteArrayOutputStream b = new ByteArrayOutputStream();
                byte[] buf = new byte[8192];
                int n;
                while ((n = in.read(buf)) != -1) b.write(buf, 0, n);
                return new JSONObject(new String(b.toByteArray(), StandardCharsets.UTF_8));
            }
        } finally {
            c.disconnect();
        }
    }

    private boolean obligatoria() {
        return info != null && (info.optBoolean("obligatoria", false) || BuildConfig.VERSION_CODE < info.optInt("versionMinima", 0));
    }

    private String version() { return info.optString("versionName", "nueva"); }

    private String notas() {
        StringBuilder s = new StringBuilder("Tienes la versión ").append(BuildConfig.VERSION_NAME).append('.');
        Object n = info.opt("notas");
        StringBuilder lista = new StringBuilder();
        if (n instanceof JSONArray) {
            JSONArray a = (JSONArray) n;
            for (int i = 0; i < a.length(); i++) {
                String t = a.optString(i).trim();
                if (!t.isEmpty()) lista.append("\n•  ").append(t);
            }
        } else if (n instanceof String && !((String) n).trim().isEmpty()) {
            lista.append("\n").append(((String) n).trim());
        }
        if (lista.length() > 0) s.append("\n\nNovedades:").append(lista);
        long t = info.optLong("tamano", 0);
        if (t > 0) s.append("\n\nTamaño de la descarga: ").append(mb(t));
        if (obligatoria()) s.append("\n\nEsta actualización es necesaria para seguir usando la app.");
        return s.toString();
    }

    private void ofrecer() {
        boolean ob = obligatoria();
        hoja = act.hoja().logo()
                .etiqueta(ob ? "Actualización obligatoria" : "Actualización disponible")
                .titulo("Versión " + version() + " lista")
                .mensaje(notas())
                .primario("Actualizar ahora", this::descargar, false)
                .cancelable(!ob, null);
        if (!ob) hoja.secundario("Más tarde", null);
        hoja.mostrar();
    }

    /* ---------- Descarga ---------- */

    private void descargar() {
        if (descargando || info == null) return;
        descargando = true;
        cancelado = false;
        hoja.titulo("Descargando versión " + version())
                .mensaje("Puedes seguir viendo esta pantalla; no cierres la app hasta que termine.")
                .sinPrimario()
                .cancelable(false, null);
        hoja.secundario(obligatoria() ? null : "Cancelar", () -> cancelado = true);
        hoja.progreso(0, "Conectando…");
        if (!hoja.visible()) hoja.mostrar();
        new Thread(this::bajar, "gk-descarga").start();
    }

    private void bajar() {
        File dir = ArchivoProvider.carpeta(act, ArchivoProvider.ACTUALIZACION);
        File destino = new File(dir, "AuditoriaKuroda-v" + version().replaceAll("[^0-9A-Za-z._-]", "") + ".apk");
        File parcial = new File(dir, destino.getName() + ".part");
        String sha = info.optString("sha256", "").trim().toLowerCase(Locale.ROOT);
        String error = null;
        HttpURLConnection c = null;
        try {
            /* Ya descargada antes (p. ej. se pospuso la instalación): no se vuelve a bajar. */
            if (destino.isFile() && !sha.isEmpty() && sha.equals(sha256(destino))) {
                listo(destino);
                return;
            }
            c = (HttpURLConnection) new URL(info.getString("url")).openConnection();
            c.setInstanceFollowRedirects(true);
            c.setConnectTimeout(15000);
            c.setReadTimeout(30000);
            c.setUseCaches(false);
            if (c.getResponseCode() != 200) throw new Falla("El servidor de actualizaciones respondió con el código " + c.getResponseCode() + ". Inténtalo más tarde.");
            long total = c.getContentLengthLong();
            if (total <= 0) total = info.optLong("tamano", -1);
            MessageDigest md = MessageDigest.getInstance("SHA-256");
            try (InputStream in = c.getInputStream(); OutputStream out = new FileOutputStream(parcial)) {
                byte[] buf = new byte[64 * 1024];
                long leido = 0, ultimoT = 0;
                int n, ultimo = -2;
                while ((n = in.read(buf)) != -1) {
                    if (cancelado) throw new InterruptedIOException("cancelado");
                    out.write(buf, 0, n);
                    md.update(buf, 0, n);
                    leido += n;
                    final int pct = total > 0 ? (int) Math.min(100, leido * 100 / total) : -1;
                    long ahora = SystemClock.uptimeMillis();
                    if (pct != ultimo && ahora - ultimoT > 150) {
                        ultimo = pct;
                        ultimoT = ahora;
                        final String txt = total > 0 ? pct + "%  ·  " + mb(leido) + " de " + mb(total) : mb(leido);
                        act.runOnUiThread(() -> hoja.progreso(pct, txt));
                    }
                }
            }
            if (!sha.isEmpty() && !sha.equals(hex(md.digest())))
                throw new Falla("El archivo descargado llegó incompleto o dañado. Inténtalo de nuevo.");
            if (destino.exists()) destino.delete();
            if (!parcial.renameTo(destino)) throw new Falla("No se pudo guardar la actualización. Revisa que haya espacio libre en el teléfono.");
            listo(destino);
            return;
        } catch (Exception e) {
            if (!cancelado) error = e instanceof Falla ? e.getMessage() : "Revisa tu conexión a internet e inténtalo de nuevo.";
        } finally {
            if (c != null) c.disconnect();
        }
        parcial.delete();
        final String err = error;
        act.runOnUiThread(() -> {
            descargando = false;
            if (err != null) fallo(err);
        });
    }

    private void listo(File f) {
        act.runOnUiThread(() -> {
            descargando = false;
            apk = f;
            instalar();
        });
    }

    private void fallo(String msg) {
        boolean ob = obligatoria();
        hoja.etiqueta("Actualización").titulo("No se pudo descargar").mensaje(msg).cancelable(!ob, null);
        hoja.sinProgreso();
        hoja.primario("Reintentar", this::descargar, false);
        hoja.secundario(ob ? null : "Cerrar", null);
        if (!hoja.visible()) hoja.mostrar();
    }

    /* ---------- Instalación ---------- */

    private void instalar() {
        if (apk == null || !apk.isFile() || hoja == null) return;
        boolean ob = obligatoria();
        hoja.sinProgreso();
        hoja.cancelable(!ob, null);
        hoja.secundario(ob ? null : "Más tarde", null);
        if (!act.getPackageManager().canRequestPackageInstalls()) {
            /* Android 8+: la primera vez hay que autorizar a la app a instalar su actualización. */
            esperandoPermiso = true;
            hoja.etiqueta("Un paso más").titulo("Permite instalar la actualización")
                    .mensaje("Android pide autorizar a Auditoría Kuroda para instalar su propia actualización.\n\n"
                            + "Toca «Abrir ajustes», activa «Permitir de esta fuente» y regresa con la flecha de atrás.");
            hoja.primario("Abrir ajustes", () -> {
                try {
                    act.startActivity(new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + act.getPackageName())));
                } catch (ActivityNotFoundException e) {
                    act.aviso("Abre Ajustes › Apps › Auditoría Kuroda › Instalar apps desconocidas");
                }
            }, false);
            if (!hoja.visible()) hoja.mostrar();
            return;
        }
        esperandoPermiso = false;
        hoja.etiqueta("Descarga completa").titulo("Instala la versión " + version())
                .mensaje("Confirma en la ventana de Android. Al terminar, la app se abrirá con la versión nueva.\n\n"
                        + "Si cerraste esa ventana, toca «Instalar».");
        hoja.primario("Instalar", this::instalar, false);
        if (!hoja.visible()) hoja.mostrar();
        Intent i = new Intent(Intent.ACTION_VIEW);
        i.setDataAndType(ArchivoProvider.uri(ArchivoProvider.ACTUALIZACION, apk), "application/vnd.android.package-archive");
        i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
        try {
            act.startActivity(i);
        } catch (ActivityNotFoundException e) {
            fallo("No se encontró el instalador de Android.");
        }
    }

    /* Al regresar de Ajustes con el permiso ya concedido, se instala sin pedir nada más. */
    void alVolver() {
        if (esperandoPermiso && act.getPackageManager().canRequestPackageInstalls()) instalar();
    }

    /* ---------- Auxiliares ---------- */

    /* Error con mensaje propio para el usuario (los de red se muestran con un texto genérico). */
    private static final class Falla extends IOException {
        Falla(String m) { super(m); }
    }

    /* Borra descargas a medias y APKs de más de 7 días. */
    private void limpiar() {
        File[] fs = ArchivoProvider.carpeta(act, ArchivoProvider.ACTUALIZACION).listFiles();
        if (fs == null) return;
        long limite = System.currentTimeMillis() - 7L * 24 * 3600 * 1000;
        for (File f : fs) if (f.getName().endsWith(".part") || f.lastModified() < limite) f.delete();
    }

    private static String sha256(File f) {
        try (InputStream in = new FileInputStream(f)) {
            MessageDigest md = MessageDigest.getInstance("SHA-256");
            byte[] buf = new byte[64 * 1024];
            int n;
            while ((n = in.read(buf)) != -1) md.update(buf, 0, n);
            return hex(md.digest());
        } catch (Exception e) {
            return "";
        }
    }

    private static String hex(byte[] b) {
        StringBuilder s = new StringBuilder(b.length * 2);
        for (byte x : b) s.append(String.format(Locale.ROOT, "%02x", x));
        return s.toString();
    }

    private static String mb(long bytes) {
        return String.format(Locale.US, "%.1f MB", bytes / 1048576.0);
    }
}

package com.grupokuroda.auditoria;

import android.content.ContentProvider;
import android.content.ContentValues;
import android.content.Context;
import android.database.Cursor;
import android.database.MatrixCursor;
import android.net.Uri;
import android.os.ParcelFileDescriptor;
import android.provider.OpenableColumns;
import android.webkit.MimeTypeMap;

import java.io.File;
import java.io.FileNotFoundException;
import java.io.IOException;

/* Comparte con otras apps (instalador de Android, visor de PDF/Excel, WhatsApp…) solo los
   archivos de dos carpetas del caché de la app:
     content://com.grupokuroda.auditoria.archivos/act/<apk>   -> cache/actualizacion
     content://com.grupokuroda.auditoria.archivos/arc/<nombre> -> cache/archivos
   Es de solo lectura y no se exporta: cada app recibe permiso solo para el archivo que se le pasa. */
public class ArchivoProvider extends ContentProvider {

    static final String AUTORIDAD = "com.grupokuroda.auditoria.archivos";
    static final String ACTUALIZACION = "act";
    static final String ARCHIVOS = "arc";

    static File carpeta(Context c, String tipo) {
        File d = new File(c.getCacheDir(), ACTUALIZACION.equals(tipo) ? "actualizacion" : "archivos");
        if (!d.exists()) d.mkdirs();
        return d;
    }

    static Uri uri(String tipo, File f) {
        return new Uri.Builder().scheme("content").authority(AUTORIDAD).appendPath(tipo).appendPath(f.getName()).build();
    }

    static String mime(String nombre) {
        String n = nombre.toLowerCase();
        if (n.endsWith(".apk")) return "application/vnd.android.package-archive";
        int p = n.lastIndexOf('.');
        String m = p >= 0 ? MimeTypeMap.getSingleton().getMimeTypeFromExtension(n.substring(p + 1)) : null;
        return m != null ? m : "application/octet-stream";
    }

    private File archivo(Uri u) throws FileNotFoundException {
        if (getContext() == null || u.getPathSegments().size() != 2) throw new FileNotFoundException();
        String tipo = u.getPathSegments().get(0);
        if (!ACTUALIZACION.equals(tipo) && !ARCHIVOS.equals(tipo)) throw new FileNotFoundException();
        File base = carpeta(getContext(), tipo);
        File f = new File(base, u.getPathSegments().get(1));
        try {
            /* Evita salir de la carpeta con "../". */
            if (!f.getCanonicalFile().getParentFile().equals(base.getCanonicalFile())) throw new FileNotFoundException();
        } catch (IOException e) {
            throw new FileNotFoundException();
        }
        if (!f.isFile()) throw new FileNotFoundException();
        return f;
    }

    @Override public boolean onCreate() { return true; }

    @Override public String getType(Uri u) { return mime(u.getLastPathSegment() == null ? "" : u.getLastPathSegment()); }

    @Override
    public ParcelFileDescriptor openFile(Uri u, String modo) throws FileNotFoundException {
        if (modo != null && modo.contains("w")) throw new FileNotFoundException("Solo lectura");
        return ParcelFileDescriptor.open(archivo(u), ParcelFileDescriptor.MODE_READ_ONLY);
    }

    @Override
    public Cursor query(Uri u, String[] columnas, String sel, String[] args, String orden) {
        File f;
        try { f = archivo(u); } catch (FileNotFoundException e) { return null; }
        String[] cols = columnas != null ? columnas : new String[]{OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE};
        MatrixCursor c = new MatrixCursor(cols, 1);
        Object[] fila = new Object[cols.length];
        for (int i = 0; i < cols.length; i++) {
            if (OpenableColumns.DISPLAY_NAME.equals(cols[i])) fila[i] = f.getName();
            else if (OpenableColumns.SIZE.equals(cols[i])) fila[i] = f.length();
        }
        c.addRow(fila);
        return c;
    }

    @Override public Uri insert(Uri u, ContentValues v) { throw new UnsupportedOperationException(); }

    @Override public int delete(Uri u, String s, String[] a) { throw new UnsupportedOperationException(); }

    @Override public int update(Uri u, ContentValues v, String s, String[] a) { throw new UnsupportedOperationException(); }
}

package com.grupokuroda.auditoria;

import android.app.Activity;
import android.app.Dialog;
import android.content.res.ColorStateList;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.ColorDrawable;
import android.graphics.drawable.GradientDrawable;
import android.text.InputType;
import android.util.TypedValue;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.view.Window;
import android.view.WindowManager;
import android.widget.Button;
import android.widget.EditText;
import android.widget.ImageView;
import android.widget.LinearLayout;
import android.widget.ProgressBar;
import android.widget.ScrollView;
import android.widget.TextView;

/* Ventana emergente de la app: hoja que sube desde abajo, con los colores del Monitor
   (claro / oscuro). La usan las actualizaciones, los archivos guardados y los avisos de la
   página (alert / confirm / prompt), para que todo se vea igual que el resto de la app. */
final class Hoja {

    interface AlCerrar { void listo(); }

    private final Activity act;
    private final Dialog dialogo;
    private final boolean oscuro;
    private final LinearLayout caja, encabezado, botones;
    private final TextView tEtiqueta, tTitulo, tMensaje, tProgreso;
    private final ScrollView desplazar;
    private final ProgressBar barra;
    private EditText campo;
    private Button bPrimario, bSecundario;
    private AlCerrar alCancelar;

    /* Paleta: la misma de css/main.css. */
    private final int cFondo, cTexto, cTenue, cSuave, cBorde, cAzul1, cAzul2;
    static final int ROJO = Color.parseColor("#F5365C");

    Hoja(Activity a, boolean oscuro) {
        this.act = a;
        this.oscuro = oscuro;
        cFondo = Color.parseColor(oscuro ? "#161B38" : "#FFFFFF");
        cTexto = Color.parseColor(oscuro ? "#F1F2F8" : "#344767");
        cTenue = Color.parseColor(oscuro ? "#BCC4D6" : "#8392AB");
        cSuave = Color.parseColor(oscuro ? "#232948" : "#F4F6FB");
        cBorde = Color.parseColor(oscuro ? "#2E3557" : "#E4E8F2");
        cAzul1 = Color.parseColor(oscuro ? "#4318FF" : "#5E72E4");
        cAzul2 = Color.parseColor(oscuro ? "#9F7AEA" : "#825EE4");

        dialogo = new Dialog(a);
        dialogo.requestWindowFeature(Window.FEATURE_NO_TITLE);

        caja = new LinearLayout(a);
        caja.setOrientation(LinearLayout.VERTICAL);
        caja.setPadding(dp(22), dp(10), dp(22), dp(20));
        GradientDrawable fondo = new GradientDrawable();
        fondo.setColor(cFondo);
        float r = dp(26);
        fondo.setCornerRadii(new float[]{r, r, r, r, 0, 0, 0, 0});
        caja.setBackground(fondo);

        /* Asa */
        View asa = new View(a);
        GradientDrawable fAsa = new GradientDrawable();
        fAsa.setColor(cBorde);
        fAsa.setCornerRadius(dp(4));
        asa.setBackground(fAsa);
        LinearLayout.LayoutParams pAsa = new LinearLayout.LayoutParams(dp(40), dp(4));
        pAsa.gravity = Gravity.CENTER_HORIZONTAL;
        pAsa.bottomMargin = dp(18);
        caja.addView(asa, pAsa);

        /* Encabezado: logo + etiqueta + título */
        encabezado = new LinearLayout(a);
        encabezado.setOrientation(LinearLayout.HORIZONTAL);
        encabezado.setGravity(Gravity.CENTER_VERTICAL);
        LinearLayout textos = new LinearLayout(a);
        textos.setOrientation(LinearLayout.VERTICAL);
        tEtiqueta = texto(11, cAzul1, true);
        tEtiqueta.setAllCaps(true);
        tEtiqueta.setLetterSpacing(0.08f);
        tEtiqueta.setVisibility(View.GONE);
        tTitulo = texto(19, cTexto, true);
        tTitulo.setVisibility(View.GONE);
        textos.addView(tEtiqueta);
        textos.addView(tTitulo);
        encabezado.addView(textos, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
        caja.addView(encabezado);

        /* Mensaje (con desplazamiento si es largo) */
        tMensaje = texto(14.5f, cTenue, false);
        tMensaje.setLineSpacing(0, 1.25f);
        tMensaje.setVisibility(View.GONE);
        tMensaje.setTextIsSelectable(true);
        desplazar = new ScrollView(a);
        desplazar.addView(tMensaje);
        LinearLayout.LayoutParams pDesp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        pDesp.topMargin = dp(10);
        caja.addView(desplazar, pDesp);

        /* Progreso de descarga */
        barra = new ProgressBar(a, null, android.R.attr.progressBarStyleHorizontal);
        barra.setMax(100);
        barra.setProgressTintList(ColorStateList.valueOf(cAzul1));
        barra.setProgressBackgroundTintList(ColorStateList.valueOf(cBorde));
        barra.setVisibility(View.GONE);
        LinearLayout.LayoutParams pBarra = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(8));
        pBarra.topMargin = dp(18);
        caja.addView(barra, pBarra);
        tProgreso = texto(12.5f, cTenue, true);
        tProgreso.setVisibility(View.GONE);
        LinearLayout.LayoutParams pProg = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        pProg.topMargin = dp(8);
        caja.addView(tProgreso, pProg);

        /* Botones */
        botones = new LinearLayout(a);
        botones.setOrientation(LinearLayout.HORIZONTAL);
        LinearLayout.LayoutParams pBot = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        pBot.topMargin = dp(22);
        caja.addView(botones, pBot);

        dialogo.setContentView(caja);
        dialogo.setOnCancelListener(d -> { if (alCancelar != null) alCancelar.listo(); });
        Window w = dialogo.getWindow();
        if (w != null) {
            w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
            w.setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
            w.setGravity(Gravity.BOTTOM);
            /* Animación de entrada/salida desde abajo (la del teclado). */
            w.setWindowAnimations(android.R.style.Animation_InputMethod);
            w.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
            w.setDimAmount(0.55f);
            w.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
            w.setNavigationBarColor(cFondo);
        }
    }

    /* ---------- Contenido ---------- */

    Hoja logo() {
        ImageView img = new ImageView(act);
        img.setImageResource(R.drawable.logo_kuroda);
        GradientDrawable f = new GradientDrawable();
        f.setShape(GradientDrawable.OVAL);
        f.setColor(Color.WHITE);
        img.setBackground(f);
        img.setPadding(dp(7), dp(7), dp(7), dp(7));
        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(dp(50), dp(50));
        p.rightMargin = dp(14);
        encabezado.addView(img, 0, p);
        return this;
    }

    Hoja etiqueta(String s) { tEtiqueta.setText(s); tEtiqueta.setVisibility(vacio(s) ? View.GONE : View.VISIBLE); return this; }

    Hoja titulo(String s) { tTitulo.setText(s); tTitulo.setVisibility(vacio(s) ? View.GONE : View.VISIBLE); return this; }

    Hoja mensaje(CharSequence s) {
        tMensaje.setText(s);
        tMensaje.setVisibility(s == null || s.length() == 0 ? View.GONE : View.VISIBLE);
        /* Mensajes largos: alto máximo de 45% de la pantalla y se desplazan. */
        int alto = act.getResources().getDisplayMetrics().heightPixels;
        ViewGroup.LayoutParams p = desplazar.getLayoutParams();
        p.height = (s != null && s.length() > 380) ? (int) (alto * 0.45f) : ViewGroup.LayoutParams.WRAP_CONTENT;
        desplazar.setLayoutParams(p);
        return this;
    }

    Hoja campo(String valor, boolean clave) {
        campo = new EditText(act);
        campo.setSingleLine(true);
        campo.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16);
        campo.setTextColor(cTexto);
        campo.setHintTextColor(cTenue);
        campo.setPadding(dp(16), dp(14), dp(16), dp(14));
        campo.setInputType(clave ? InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD : InputType.TYPE_CLASS_TEXT);
        if (valor != null) campo.setText(valor);
        GradientDrawable f = new GradientDrawable();
        f.setColor(cSuave);
        f.setCornerRadius(dp(14));
        f.setStroke(dp(1), cBorde);
        campo.setBackground(f);
        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
        p.topMargin = dp(16);
        caja.addView(campo, caja.indexOfChild(botones), p);
        Window w = dialogo.getWindow();
        if (w != null) w.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE | WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE);
        campo.requestFocus();
        return this;
    }

    String textoCampo() { return campo == null ? "" : campo.getText().toString(); }

    /* Botón principal. cierra = false lo deja abierto (p. ej. al empezar una descarga). */
    Hoja primario(String texto, Runnable accion, boolean cierra) { return primario(texto, accion, cierra, false); }

    Hoja primario(String texto, Runnable accion, boolean cierra, boolean peligro) {
        if (bPrimario == null) {
            bPrimario = boton(true);
            botones.addView(bPrimario);
            acomodarBotones();
        }
        GradientDrawable f = peligro
                ? new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{ROJO, Color.parseColor("#F56036")})
                : new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{cAzul1, cAzul2});
        f.setCornerRadius(dp(16));
        bPrimario.setBackground(f);
        bPrimario.setText(texto);
        bPrimario.setOnClickListener(v -> { if (cierra) cerrar(); if (accion != null) accion.run(); });
        bPrimario.setVisibility(View.VISIBLE);
        return this;
    }

    Hoja secundario(String texto, Runnable accion) {
        if (texto == null) {
            if (bSecundario != null) bSecundario.setVisibility(View.GONE);
            acomodarBotones();
            return this;
        }
        if (bSecundario == null) {
            bSecundario = boton(false);
            botones.addView(bSecundario, 0);
        }
        bSecundario.setText(texto);
        bSecundario.setVisibility(View.VISIBLE);
        bSecundario.setOnClickListener(v -> { cerrar(); if (accion != null) accion.run(); });
        acomodarBotones();
        return this;
    }

    Hoja sinPrimario() { if (bPrimario != null) bPrimario.setVisibility(View.GONE); acomodarBotones(); return this; }

    /* Tocar fuera o el botón Atrás: se cierra y llama alCancelar (null = no se puede cerrar). */
    Hoja cancelable(boolean si, AlCerrar alCancelar) {
        this.alCancelar = alCancelar;
        dialogo.setCancelable(si);
        dialogo.setCanceledOnTouchOutside(si);
        return this;
    }

    /* Barra de progreso (pct < 0 = indeterminado). */
    void progreso(int pct, String texto) {
        barra.setVisibility(View.VISIBLE);
        barra.setIndeterminate(pct < 0);
        if (pct >= 0) barra.setProgress(pct);
        tProgreso.setVisibility(vacio(texto) ? View.GONE : View.VISIBLE);
        tProgreso.setText(texto);
    }

    void sinProgreso() { barra.setVisibility(View.GONE); tProgreso.setVisibility(View.GONE); }

    void mostrar() {
        if (act.isFinishing() || act.isDestroyed()) return;
        try { dialogo.show(); } catch (RuntimeException ignorado) { }
    }

    void cerrar() { try { if (dialogo.isShowing()) dialogo.dismiss(); } catch (RuntimeException ignorado) { } }

    boolean visible() { return dialogo.isShowing(); }

    /* ---------- Auxiliares ---------- */

    private void acomodarBotones() {
        int n = 0;
        for (int i = 0; i < botones.getChildCount(); i++) if (botones.getChildAt(i).getVisibility() == View.VISIBLE) n++;
        boolean primero = true;
        for (int i = 0; i < botones.getChildCount(); i++) {
            View b = botones.getChildAt(i);
            LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(52), 1);
            if (!primero && b.getVisibility() == View.VISIBLE) p.leftMargin = dp(10);
            if (b.getVisibility() == View.VISIBLE) primero = false;
            b.setLayoutParams(p);
        }
        botones.setVisibility(n == 0 ? View.GONE : View.VISIBLE);
    }

    private Button boton(boolean principal) {
        Button b = new Button(act);
        b.setAllCaps(false);
        b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
        b.setTypeface(Typeface.DEFAULT_BOLD);
        b.setStateListAnimator(null);
        b.setElevation(0);
        b.setTextColor(principal ? Color.WHITE : cTexto);
        if (!principal) {
            GradientDrawable f = new GradientDrawable();
            f.setColor(cSuave);
            f.setCornerRadius(dp(16));
            f.setStroke(dp(1), cBorde);
            b.setBackground(f);
        }
        return b;
    }

    private TextView texto(float sp, int color, boolean negrita) {
        TextView t = new TextView(act);
        t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
        t.setTextColor(color);
        if (negrita) t.setTypeface(Typeface.DEFAULT_BOLD);
        return t;
    }

    private int dp(float v) { return Math.round(v * act.getResources().getDisplayMetrics().density); }

    private static boolean vacio(String s) { return s == null || s.trim().isEmpty(); }

    boolean esOscuro() { return oscuro; }
}

