plugins {
    id 'com.android.application'
}

/* Notificaciones (Firebase Cloud Messaging): el workflow escribe app/google-services.json desde el
   secreto GOOGLE_SERVICES_JSON. Sin ese archivo la app se compila igual, solo sin notificaciones. */
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

/* Versión: la pone el workflow de GitHub (.github/workflows/android-apk.yml) con
   APK_VERSION_NAME. El versionCode se calcula de la versión: 1.2.3 -> 10203, así cada
   versión nueva siempre es mayor que la anterior y Android acepta la actualización. */
def nombreVersion = System.getenv('APK_VERSION_NAME') ?: '1.1.0'
def partesVersion = (nombreVersion.tokenize('.') + ['0', '0', '0']).take(3).collect { it.replaceAll('[^0-9]', '') ?: '0' }
def codigoVersion = partesVersion[0].toInteger() * 10000 + partesVersion[1].toInteger() * 100 + partesVersion[2].toInteger()

/* Firma: el workflow decodifica el secreto ANDROID_KEYSTORE_BASE64 y pasa la ruta aquí.
   Todas las versiones deben firmarse con la MISMA llave o Android rechaza la actualización. */
def llave = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.grupokuroda.auditoria'
    compileSdk 34

    defaultConfig {
        applicationId 'com.grupokuroda.auditoria'
        minSdk 26
        targetSdk 34
        versionCode codigoVersion
        versionName nombreVersion

        buildConfigField 'String', 'URL_APP', '"https://informe-de-tareas-grupo-kuroda.vercel.app/"'
        /* latest.json que publica el workflow en Supabase Storage (bucket público app-releases). */
        buildConfigField 'String', 'URL_ACTUALIZACION', '"https://xlygkolfmetytowixtnb.supabase.co/storage/v1/object/public/app-releases/latest.json"'
    }

    signingConfigs {
        if (llave) {
            release {
                storeFile file(llave)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (llave) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
