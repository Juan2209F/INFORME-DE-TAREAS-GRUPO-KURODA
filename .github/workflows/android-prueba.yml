# Prueba la app en un emulador Android real (WebView de Android, no un navegador de escritorio):
# instala el APK, abre el Monitor y desliza con el dedo (adb input swipe) para comprobar que la
# página se desplaza. Deja capturas de pantalla como artefacto "capturas-prueba".
# No publica nada en Supabase.
name: APK Android — prueba en emulador

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de prueba
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/prueba-apk.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-prueba
          path: capturas/
          retention-days: 7
