# Compila la app Android, la firma y la publica en Supabase Storage.
# Al terminar, las apps instaladas (v1.1 o mayor) ven la actualización al abrirse.
#
# Cómo usarlo: GitHub › Actions › "APK Android — publicar versión" › Run workflow
#   versión     1.1.0, 1.2.0, 1.2.1… (siempre mayor que la anterior)
#   novedades   separadas con | (ej. "Nuevo diseño|Actualizaciones automáticas")
#   obligatoria marcar si nadie debe seguir usando la versión anterior
# También corre al subir una etiqueta apk-v1.2.0 (sin novedades, no obligatoria).
#
# Secretos necesarios (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64     llave de firma (.jks) en base64. SIEMPRE la misma.
#   ANDROID_KEYSTORE_PASSWORD   contraseña de la llave
#   ANDROID_KEY_ALIAS           alias dentro de la llave (ej. kuroda)
#   ANDROID_KEY_PASSWORD        opcional; si no existe se usa ANDROID_KEYSTORE_PASSWORD
#   SUPABASE_SERVICE_ROLE_KEY   llave service_role (o secret key sb_secret_…) de Supabase
name: APK Android — publicar versión

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. 1.1.0)'
        required: true
      notas:
        description: 'Novedades, separadas con |'
        required: false
        default: 'Mejoras y correcciones'
      obligatoria:
        description: 'Actualización obligatoria'
        type: boolean
        default: false
  push:
    tags: ['apk-v*']

concurrency:
  group: android-apk
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: https://xlygkolfmetytowixtnb.supabase.co
  BUCKET: app-releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: v
        env:
          ENTRADA: ${{ inputs.version }}
        run: |
          V="${ENTRADA:-${GITHUB_REF_NAME#apk-v}}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Versión inválida: '$V'. Usa el formato 1.2.0"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$V"; PA=${PA:-0}
          CODE=$((MA*10000 + MI*100 + PA))
          if [ "$CODE" -le 10000 ]; then echo "::error::La versión debe ser mayor que 1.0 (la que ya está instalada)."; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versión $V (versionCode $CODE)"

      - name: Revisar secretos
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          SB: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          falta=0
          [ -z "$KS" ] && echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (ver GUIA-APK.md)" && falta=1
          [ -z "$KP" ] && echo "::error::Falta el secreto ANDROID_KEYSTORE_PASSWORD" && falta=1
          [ -z "$KA" ] && echo "::error::Falta el secreto ANDROID_KEY_ALIAS" && falta=1
          [ -z "$SB" ] && echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY" && falta=1
          exit $falta

      - name: Llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/kuroda.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/kuroda.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android
        env:
          APK_VERSION_NAME: ${{ steps.v.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar firma
        id: apk
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se generó el APK firmado"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee firma.txt
          NOMBRE="AuditoriaKuroda-v${{ steps.v.outputs.name }}.apk"
          cp "$APK" "$NOMBRE"
          echo "archivo=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$NOMBRE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "tamano=$(stat -c%s "$NOMBRE")" >> "$GITHUB_OUTPUT"

      - name: Publicar en Supabase Storage
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTAS: ${{ inputs.notas }}
          OBLIGATORIA: ${{ inputs.obligatoria || false }}
          ARCHIVO: ${{ steps.apk.outputs.archivo }}
          SHA: ${{ steps.apk.outputs.sha }}
          TAMANO: ${{ steps.apk.outputs.tamano }}
          VNAME: ${{ steps.v.outputs.name }}
          VCODE: ${{ steps.v.outputs.code }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $SB_KEY" -H "apikey: $SB_KEY")

          # 1) Bucket público (se crea la primera vez; si ya existe no pasa nada). Sin límite propio:
          #    usa el límite de archivo del proyecto (50 MB en el plan gratuito; el APK pesa mucho menos).
          C=$(curl -s -o crear.json -w '%{http_code}' -X POST "$SUPABASE_URL/storage/v1/bucket" "${AUTH[@]}" \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$BUCKET\",\"name\":\"$BUCKET\",\"public\":true}")
          echo "Bucket: HTTP $C $(cat crear.json)"
          if ! curl -sS --fail -o /dev/null "$SUPABASE_URL/storage/v1/bucket/$BUCKET" "${AUTH[@]}"; then
            echo "::error::No se pudo crear el bucket $BUCKET en Supabase (respuesta: $(cat crear.json))"; exit 1
          fi

          # 2) El APK
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$ARCHIVO" "${AUTH[@]}" \
            -H 'Content-Type: application/vnd.android.package-archive' -H 'x-upsert: true' -H 'cache-control: 31536000' \
            --data-binary "@$ARCHIVO"
          echo

          # 3) latest.json (lo que lee la app al abrir)
          URL_APK="$SUPABASE_URL/storage/v1/object/public/$BUCKET/$ARCHIVO"
          jq -n --argjson code "$VCODE" --arg name "$VNAME" --arg url "$URL_APK" --arg sha "$SHA" \
            --argjson tamano "$TAMANO" --arg notas "${NOTAS:-Mejoras y correcciones}" --argjson ob "$OBLIGATORIA" \
            --arg fecha "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$code, versionName:$name, url:$url, sha256:$sha, tamano:$tamano,
              notas:($notas | split("|") | map(gsub("^\\s+|\\s+$";"")) | map(select(length>0))),
              obligatoria:$ob, versionMinima:0, fecha:$fecha}' > latest.json
          cat latest.json
          cp latest.json "v$VNAME.json"
          for F in latest.json "v$VNAME.json"; do
            DEST="$F"; [ "$F" != latest.json ] && DEST="versiones/$F"
            curl -sS --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$DEST" "${AUTH[@]}" \
              -H 'Content-Type: application/json' -H 'x-upsert: true' -H 'cache-control: 0' --data-binary "@$F"
            echo
          done

          # 4) Comprobar que quedó público
          curl -sS --fail "$SUPABASE_URL/storage/v1/object/public/$BUCKET/latest.json?t=$(date +%s)" | jq .
          {
            echo "### ✅ Versión $VNAME publicada"
            echo "- APK: $URL_APK"
            echo "- SHA-256: \`$SHA\`"
            echo "- Obligatoria: $OBLIGATORIA"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.archivo }}
          path: ${{ steps.apk.outputs.archivo }}
          retention-days: 30
